name: Publish to npm

# Runs when a GitHub Release is published (the tag must match package.json, e.g. v0.2.0).
# Authenticates with npm Trusted Publishing (OIDC): no token or 2FA code needed.
# npmjs.com → @appress/sdk → Settings → Trusted Publisher: Appress-AI / appress-sdk-js / publish.yml
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # OIDC identity for npm + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Trusted Publishing needs npm CLI 11.5.1+, which ships with Node 24.
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - name: Check that the tag matches the package version
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - run: npm publish
