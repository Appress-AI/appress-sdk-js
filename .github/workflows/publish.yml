name: Publish to npm

# GitHub'da bir Release yayınlanınca çalışır (etiket package.json sürümüyle aynı olmalı, örn. v0.2.0).
# Kimlik doğrulama npm Trusted Publishing (OIDC) ile yapılır: token veya 2FA kodu gerekmez.
# npmjs.com → @appress/sdk → Settings → Trusted Publisher: Appress-AI / appress-sdk-js / publish.yml
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # OIDC ile npm'e kimlik + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Trusted Publishing npm CLI 11.5.1+ ister; Node 24 bunu hazır getirir.
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - name: Etiket ile paket sürümü aynı mı
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - run: npm publish
